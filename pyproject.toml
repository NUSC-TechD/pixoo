[project]
name = "nusc-pixoo"
version = "0.1.0"
description = "Local-first FastAPI server for NUSC Pixoo 64 displays"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120,<1",
    "httpx>=0.28,<1",
    "pillow>=12,<13",
    "pydantic-settings>=2.12,<3",
    "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixoo_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
